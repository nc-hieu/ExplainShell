server {
    listen 80;

    # 1. Điều hướng request của giao diện về Vite (web_app)
    location / {
        proxy_pass http://web_app:5173; # Trỏ thẳng vào cổng mặc định của Vite trong container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cấu hình bắt buộc để Vite HMR (Hot Reload) hoạt động qua Proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Điều hướng request API về Backend (api_server)
    location /api/ {
        proxy_pass http://api_server:8000/api/; # Trỏ thẳng vào cổng của api_server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
