services:
  db:
    image: postgres:15
    container_name: exsh_db
    restart: always
    environment:
      POSTGRES_USER: nchieu
      POSTGRES_PASSWORD: Hieu12102001
      POSTGRES_DB: explainshell_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB_Init:/docker-entrypoint-initdb.d

  api_server:
    build: ./API_Server
    container_name: exsh_api_srv
    restart: always
    environment:
      - DATABASE_URL=postgresql://nchieu:Hieu12102001@db:5432/explainshell_db
    depends_on:
      - db   # Chờ db khởi động trước


  web_app:
    build: ./Web_App
    container_name: exsh_web_app
    restart: always
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - api_server   # Chờ api_server khởi động trước


  nginx:
    image: nginx:alpine
    container_name: exsh_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Map file cấu hình vào Nginx
    depends_on:
      - web_app
      - api_server

volumes:
  postgres_data: 
